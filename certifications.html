<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Certifications & Achievements — Vedant Paste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&family=Permanent+Marker&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #14171C;
      --panel: #191D24;
      --line: #2A2E36;
      --text: #E9E7DD;
      --muted: #9A9D96;
      --dim: #6E716C;
      --amber: #E8C468;
      --teal: #4FB4A8
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono';
      padding: 20px
    }

    .frame {
      max-width: 1180px;
      height: calc(100vh - 40px);
      max-height: 800px;
      margin: auto;
      border: .5px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    nav {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      border-bottom: .5px solid var(--line);
      flex-shrink: 0
    }

    .logo {
      font-family: 'Permanent Marker';
      font-size: 20px
    }

    .logo span {
      color: var(--amber)
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none
    }

    .nav-links a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none
    }

    .nav-links a:hover,
    .nav-links li.active a {
      color: var(--text)
    }

    .nav-links li.active {
      position: relative
    }

    .nav-links li.active:after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -21px;
      height: 1px;
      background: var(--amber)
    }

    .nav-icons {
      display: flex;
      gap: 8px
    }

    .social,
    .theme-toggle,
    .menu-toggle {
      width: 30px;
      height: 30px;
      border: .5px solid var(--line);
      border-radius: 6px;
      background: none;
      color: var(--dim);
      display: flex;
      align-items: center;
      justify-content: center
    }

    .social svg {
      width: 15px;
      height: 15px;
      fill: currentColor
    }

    .theme-toggle,
    .menu-toggle {
      cursor: pointer
    }

    .menu-toggle {
      display: none
    }

    .switcher {
      height: 62px;
      border-bottom: .5px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 6px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, .03)
    }

    .switch {
      border: .5px solid transparent;
      border-radius: 6px;
      padding: 9px 14px;
      color: var(--muted);
      background: none;
      font: inherit;
      font-size: 11px;
      cursor: pointer
    }

    .switch:hover {
      color: var(--text)
    }

    .switch.active {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--panel)
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 245px 1fr;
      min-height: 0
    }

    .item-list {
      border-right: .5px solid var(--line);
      padding: 18px 0;
      overflow-y: auto
    }

    .item {
      padding: 15px 22px;
      border-left: 2px solid transparent;
      cursor: pointer
    }

    .item:hover {
      background: rgba(255, 255, 255, .025)
    }

    .item.active {
      border-left-color: var(--amber);
      background: var(--panel)
    }

    .item .name {
      font-family: 'Space Grotesk';
      font-size: 12.5px;
      color: var(--muted)
    }

    .item.active .name {
      color: var(--text)
    }

    .item small {
      display: block;
      margin-top: 5px;
      color: var(--dim);
      font-size: 9.5px
    }

    .detail {
      padding: 34px 42px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 315px;
      gap: 40px;
      align-items: center;
      overflow: auto
    }

    .eyebrow {
      font-size: 10.5px;
      color: var(--dim)
    }

    h1 {
      font-family: 'Space Grotesk';
      font-size: 31px;
      line-height: 1.05;
      margin: 8px 0 12px
    }

    .intro {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.8;
      max-width: 650px
    }

    .block {
      margin-top: 19px
    }

    .block label {
      font-size: 10px;
      color: var(--teal)
    }

    .block p {
      margin-top: 6px;
      font-size: 11.5px;
      line-height: 1.7;
      color: var(--muted)
    }

    .chips {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 9px
    }

    .chips span {
      border: .5px solid var(--line);
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 9.5px;
      color: var(--muted)
    }

    .proof {
      margin-top: 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .proof a,
    .proof span {
      border: .5px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px
    }

    .proof a:hover {
      border-color: var(--amber);
      color: var(--amber)
    }

    .media {
      border: .5px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden
    }

    .media-frame {
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px
    }

    .media-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 7px
    }

    .media-note {
      border-top: .5px solid var(--line);
      padding: 10px 12px;
      font-size: 9px;
      line-height: 1.55;
      color: var(--dim)
    }

    footer {
      height: 56px;
      border-top: .5px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      flex-shrink: 0
    }

    footer a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none
    }

    .dots {
      display: flex;
      gap: 7px
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--line)
    }

    .dot.on {
      width: 16px;
      border-radius: 3px;
      background: var(--amber)
    }

    body.light {
      --bg: #E9E5DD;
      --panel: #F5F1E8;
      --line: #D6CFC2;
      --text: #1F2A25;
      --muted: #657068;
      --dim: #8C8477;
      --text-muted: #657068;
      --text-dim: #8C8477;
      --amber: #A96F2A;
      --teal: #2F6F68
    }

    @media(max-width:900px) {
      .nav-links {
        display: none
      }

      .menu-toggle {
        display: flex
      }

      .nav-links.open {
        display: flex;
        position: absolute;
        top: 74px;
        left: 20px;
        right: 20px;
        background: var(--panel);
        border: .5px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        flex-direction: column;
        gap: 0;
        z-index: 10
      }

      .nav-links.open a {
        display: block;
        padding: 10px
      }

      .nav-links.open li.active:after {
        display: none
      }

      .detail {
        grid-template-columns: 1fr
      }

      .media {
        max-width: 400px
      }
    }

    @media(max-width:650px) {
      body {
        padding: 0
      }

      .frame {
        height: auto;
        min-height: 100vh;
        max-height: none;
        border-radius: 0;
        border-left: 0;
        border-right: 0
      }

      .switcher {
        overflow-x: auto
      }

      .switch {
        white-space: nowrap
      }

      .main {
        display: block
      }

      main {
        display: flex;
        flex-direction: column
      }

      .item-list {
        display: flex;
        overflow-x: auto;
        border-right: 0;
        border-bottom: .5px solid var(--line);
        padding: 8px
      }

      .item {
        min-width: 185px;
        border-left: 0;
        border-bottom: 2px solid transparent;
        padding: 12px
      }

      .item.active {
        border-bottom-color: var(--amber)
      }

      .detail {
        padding: 28px 20px
      }

      .media {
        max-width: none
      }
    }

    /* ===== Portfolio v3 fullscreen + stone light theme ===== */

    @media (max-width:700px) {

    /* ===== v5 light editorial background ===== */
    .frame {
      position: relative;
      isolation: isolate;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 64px 0 0;
