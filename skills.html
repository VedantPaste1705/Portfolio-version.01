<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Skills — Vedant Paste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&family=Permanent+Marker&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #14171C;
      --panel: #191D24;
      --line: #2A2E36;
      --text: #E9E7DD;
      --muted: #9A9D96;
      --dim: #6E716C;
      --amber: #E8C468;
      --teal: #4FB4A8
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono';
      padding: 20px
    }

    .frame {
      max-width: 1180px;
      height: calc(100vh - 40px);
      max-height: 760px;
      margin: auto;
      border: .5px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    nav {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      border-bottom: .5px solid var(--line);
      flex-shrink: 0
    }

    .logo {
      font-family: 'Permanent Marker';
      font-size: 20px
    }

    .logo span {
      color: var(--amber)
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none
    }

    .nav-links a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none
    }

    .nav-links a:hover,
    .nav-links li.active a {
      color: var(--text)
    }

    .nav-links li.active {
      position: relative
    }

    .nav-links li.active:after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -21px;
      height: 1px;
      background: var(--amber)
    }

    .nav-icons {
      display: flex;
      gap: 8px
    }

    .social,
    .theme-toggle,
    .menu-toggle {
      width: 30px;
      height: 30px;
      border: .5px solid var(--line);
      border-radius: 6px;
      background: none;
      color: var(--dim);
      display: flex;
      align-items: center;
      justify-content: center
    }

    .social svg {
      width: 15px;
      height: 15px;
      fill: currentColor
    }

    .theme-toggle,
    .menu-toggle {
      cursor: pointer
    }

    .menu-toggle {
      display: none
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 245px 1fr;
      min-height: 0
    }

    .skill-list {
      border-right: .5px solid var(--line);
      padding: 22px 0;
      overflow-y: auto
    }

    .skill-item {
      padding: 16px 24px;
      border-left: 2px solid transparent;
      cursor: pointer
    }

    .skill-item:hover {
      background: rgba(255, 255, 255, .025)
    }

    .skill-item.active {
      border-left-color: var(--amber);
      background: var(--panel)
    }

    .skill-item .name {
      font-family: 'Space Grotesk';
      font-size: 13px;
      color: var(--muted)
    }

    .skill-item.active .name {
      color: var(--text)
    }

    .skill-item small {
      display: block;
      margin-top: 5px;
      color: var(--dim);
      font-size: 10px
    }

    .detail {
      padding: 44px 52px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      gap: 46px;
      align-items: center
    }

    .eyebrow {
      font-size: 10.5px;
      color: var(--dim)
    }

    h1 {
      font-family: 'Space Grotesk';
      font-size: 34px;
      line-height: 1.05;
      margin: 9px 0 13px
    }

    .intro {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.8;
      max-width: 650px
    }

    .block {
      margin-top: 24px
    }

    .block label {
      font-size: 10.5px;
      color: var(--teal)
    }

    .block p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.75
    }

    .techs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px
    }

    .techs span {
      border: .5px solid var(--line);
      border-radius: 5px;
      padding: 6px 8px;
      font-size: 10px;
      color: var(--muted)
    }

    .evidence {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 24px
    }

    .evidence a,
    .evidence span {
      border: .5px solid var(--line);
      border-radius: 6px;
      padding: 9px 11px;
      font-size: 10.5px;
      text-decoration: none;
      color: var(--muted)
    }

    .evidence a:hover {
      border-color: var(--amber);
      color: var(--amber)
    }

    .side-card {
      border: .5px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 22px
    }

    .side-card .mini {
      font-size: 10px;
      color: var(--dim)
    }

    .side-card .big {
      font-family: 'Space Grotesk';
      font-size: 26px;
      margin: 8px 0;
      color: var(--text)
    }

    .side-card p {
      font-size: 10.5px;
      color: var(--muted);
      line-height: 1.7
    }

    .side-line {
      height: 1px;
      background: var(--line);
      margin: 18px 0
    }

    .progress {
      height: 5px;
      background: var(--line);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 8px
    }

    .progress span {
      display: block;
      height: 100%;
      width: 72%;
      background: var(--amber)
    }

    footer {
      height: 56px;
      border-top: .5px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      flex-shrink: 0
    }

    footer a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none
    }

    .dots {
      display: flex;
      gap: 7px
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--line)
    }

    .dot.on {
      width: 16px;
      border-radius: 3px;
      background: var(--amber)
    }

    body.light {
      --bg: #E9E5DD;
      --panel: #F5F1E8;
      --line: #D6CFC2;
      --text: #1F2A25;
      --muted: #657068;
      --dim: #8C8477;
      --text-muted: #657068;
      --text-dim: #8C8477;
      --amber: #A96F2A;
      --teal: #2F6F68
    }

    @media(max-width:900px) {
      .nav-links {
        display: none
      }

      .menu-toggle {
        display: flex
      }

      .nav-links.open {
        display: flex;
        position: absolute;
        top: 74px;
        left: 20px;
        right: 20px;
        background: var(--panel);
        border: .5px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        flex-direction: column;
        gap: 0;
        z-index: 10
      }

      .nav-links.open a {
        display: block;
        padding: 10px
      }

      .nav-links.open li.active:after {
        display: none
      }

      .detail {
        grid-template-columns: 1fr
      }

      .side-card {
        max-width: 360px
      }
    }

    @media(max-width:650px) {
      body {
        padding: 0
      }

      .frame {
        min-height: 100vh;
        height: auto;
        max-height: none;
        border-radius: 0;
        border-left: 0;
        border-right: 0
      }

      main {
        display: flex;
        flex-direction: column
      }

      .skill-list {
        display: flex;
        overflow-x: auto;
        border-right: 0;
        border-bottom: .5px solid var(--line);
        padding: 8px
      }

      .skill-item {
        min-width: 175px;
        border-left: 0;
        border-bottom: 2px solid transparent;
        padding: 12px 14px
      }

      .skill-item.active {
        border-bottom-color: var(--amber)
      }

      .detail {
        padding: 30px 22px
      }

      .side-card {
        max-width: none
      }
    }

    /* ===== Portfolio v3 fullscreen + stone light theme ===== */

    body {

      }

      nav {

      }

      .nav-links.open {

      }

      }

    @media (max-width:700px) {
      .nav-icons {
        gap: 6px !important;
      }

      .social {
        display: none !important;
      }

      .hero h1 {

      }

      .hero-copy {
        padding: 44px 22px !important;
      }

      .hero-side {
        padding: 22px !important;
      }

      .profile,
      .photo,
      .media-box {

      }

      .profile-placeholder,
      .placeholder {
        min-height: 220px !important;

      }

      .progress svg {
        height: 145px !important;
      }

      .cards {
        gap: 12px !important;
      }

      .card {
        padding: 18px !important;
      }

      .project-detail {
        padding: 28px 22px !important;
      }

      .skill-list,
      .cert-list,

      .project-list {

      }

      .skill-item,
      .cert-item,
      .list-item {

      }

      .section-head,
      .below-head {
        align-items: flex-start !important;
        flex-direction: column !important;
        gap: 8px !important;
      }
    }

    @media (max-width:430px) {
      .logo {
        font-size: 18px !important;
      }

      .theme-toggle,
      .menu-toggle {
        width: 36px !important;

      }

      }

      .home-section {
        padding: 22px 18px !important;
      }

      .progress-note,
      .desc {
        font-size: 11.5px !important;
      }
    }

    /* ===== v5 light editorial background ===== */
    .frame {
      position: relative;
      isolation: isolate;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 64px 0 0;
      background: url("assets/neuron-light.png") center/520px auto repeat;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    .frame>* {
      position: relative;
      z-index: 1;
    }

    body.light {
      --bg: #DDE2E4;
      --panel: #EEF2F2;
      --line: #AFC0C0;
      --text: #182329;
      --muted: #52636A;
      --dim: #728288;
      --amber: #A85E28;
      --teal: #176F70;
